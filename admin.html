<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - CODEHCIU</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/chance_pass.css">
    <link rel="stylesheet" href="css/politicas-modal.css">
    <link rel="shortcut icon" href="css/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- Cargar navbar dinámicamente -->
    <div id="navbar-container"></div>

    <!-- Contenedor para el modal de políticas -->
    <div id="politicas-modal-container"></div>

    <div class="admin-container">
        <h2 style="margin-bottom: 20px;">Administrar Noticias</h2>
        <button id="add-news-btn" class="btn">+ Añadir Noticia</button>
        <div class="news-list" id="news-list">
            <!-- Noticias cargadas dinámicamente -->
        </div>
    </div>

    <div id="change-password-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cambiar Contraseña</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="change-password-form">
                    <div class="form-group">
                        <label for="current-password">Contraseña Actual:</label>
                        <input type="password" id="current-password" name="current_password">
                        <small>Solo necesario si no es el primer inicio</small>
                    </div>

                    <div class="form-group">
                        <label for="new-password">Nueva Contraseña:</label>
                        <div class="password-input-container">
                            <input type="password" id="new-password" name="new_password" required>
                            <button type="button" class="toggle-password" data-target="new-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <small id="password-requirements">
                            La contraseña debe tener al menos 8 caracteres, incluir mayúsculas, minúsculas, números y un
                            carácter especial
                        </small>
                        <div id="password-strength" class="password-strength">
                            <div class="strength-bar"></div>
                            <span class="strength-text">Seguridad: Débil</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirmar Nueva Contraseña:</label>
                        <div class="password-input-container">
                            <input type="password" id="confirm-password" name="confirm_password" required>
                            <button type="button" class="toggle-password" data-target="confirm-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <small id="password-match" class="hidden">Las contraseñas no coinciden</small>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn" id="submit-password-change">Cambiar Contraseña</button>
                        <button type="button" class="btn cancel" id="cancel-password-change">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/news-admin.js"></script>
    <script src="js/politicas-modal.js"></script>
    <script src="js/responsive.js"></script>
    <script src="js/change-password.js"></script>
    <script>
        // Cargar navbar
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
                // Inicializar navbar
                initializeNavbar();
            })
            .catch(error => {
                console.error('Error cargando navbar:', error);
            });


            function initializeNavbar() {
                    function updateNavbarByRole(role) {
                        // Obtener todos los elementos del navbar por sus IDs
                        const noticiasItem = document.getElementById('noticias-item');
                        const finanzasItem = document.getElementById('finanzas-item');
                        const credencialesItem = document.getElementById('credenciales-item');
                        const politicasItem = document.getElementById('politicas-item');
                        const correoItem = document.getElementById('correo-item');
                        const usuariosItem = document.getElementById('usuarios-item');
                        const userInfoItem = document.getElementById('user-info-item');
                        const logoutItem = document.getElementById('logout-item');

                        // Ocultar todos los elementos primero
                        if (noticiasItem) noticiasItem.style.display = 'none';
                        if (finanzasItem) finanzasItem.style.display = 'none';
                        if (credencialesItem) credencialesItem.style.display = 'none';
                        if (politicasItem) politicasItem.style.display = 'none';
                        if (correoItem) correoItem.style.display = 'none';
                        if (usuariosItem) usuariosItem.style.display = 'none';
                        // userInfoItem y logoutItem siempre deben ser visibles
                        if (userInfoItem) userInfoItem.style.display = 'list-item';
                        if (logoutItem) logoutItem.style.display = 'list-item';

                        // Mostrar elementos según el rol (case insensitive)
                        const roleLower = role.toLowerCase();

                        switch (roleLower) {
                            case 'admin':
                            case 'administrador':
                                // Admin: todos los enlaces
                                if (noticiasItem) noticiasItem.style.display = 'list-item';
                                if (finanzasItem) finanzasItem.style.display = 'list-item';
                                if (credencialesItem) credencialesItem.style.display = 'list-item';
                                if (politicasItem) politicasItem.style.display = 'list-item';
                                if (correoItem) correoItem.style.display = 'list-item';
                                if (usuariosItem) usuariosItem.style.display = 'list-item';
                                break;

                            case 'editor':
                                // Editor: noticias, credenciales, correo, ver politicas, cerrar sesion
                                if (noticiasItem) noticiasItem.style.display = 'list-item';
                                if (credencialesItem) credencialesItem.style.display = 'list-item';
                                if (politicasItem) politicasItem.style.display = 'list-item';
                                if (correoItem) correoItem.style.display = 'list-item';
                                break;

                            case 'contab':
                            case 'contador':
                                // Contab: finanzas, credenciales, ver politicas, correo, cerrar sesion
                                if (finanzasItem) finanzasItem.style.display = 'list-item';
                                if (credencialesItem) credencialesItem.style.display = 'list-item';
                                if (politicasItem) politicasItem.style.display = 'list-item';
                                if (correoItem) correoItem.style.display = 'list-item';
                                break;

                            case 'coord':
                            case 'coordinador':
                                // Coord: finanzas, credenciales, ver politicas, correo, cerrar sesion
                                if (finanzasItem) finanzasItem.style.display = 'list-item';
                                if (credencialesItem) credencialesItem.style.display = 'list-item';
                                if (politicasItem) politicasItem.style.display = 'list-item';
                                if (correoItem) correoItem.style.display = 'list-item';
                                break;

                            case 'socio':
                                // Socio: finanzas, ver politicas, cerrar sesion
                                if (finanzasItem) finanzasItem.style.display = 'list-item';
                                if (politicasItem) politicasItem.style.display = 'list-item';
                                break;

                            case 'directivo':
                                // Directivo: noticias, finanzas, credenciales, ver politicas, correo, cerrar sesion
                                if (noticiasItem) noticiasItem.style.display = 'list-item';
                                if (finanzasItem) finanzasItem.style.display = 'list-item';
                                if (credencialesItem) credencialesItem.style.display = 'list-item';
                                if (politicasItem) politicasItem.style.display = 'list-item';
                                if (correoItem) correoItem.style.display = 'list-item';
                                break;

                            case 'regular':
                                // Regular: credenciales, ver politica, correo, cerrar sesion
                                if (credencialesItem) credencialesItem.style.display = 'list-item';
                                if (politicasItem) politicasItem.style.display = 'list-item';
                                if (correoItem) correoItem.style.display = 'list-item';
                                break;

                            default:
                                // Para roles no definidos, mostrar solo lo mínimo (similar a regular)
                                if (credencialesItem) credencialesItem.style.display = 'list-item';
                                if (politicasItem) politicasItem.style.display = 'list-item';
                                if (correoItem) correoItem.style.display = 'list-item';
                                break;
                        }
                    }

                    function checkSession() {
                        const userData = localStorage.getItem('user');
                        if (userData) {
                            try {
                                const user = JSON.parse(userData);
                                const usernameElement = document.getElementById('username');
                                if (usernameElement) {
                                    usernameElement.textContent = user.name;
                                }

                                updateNavbarByRole(user.role);

                                // Roles permitidos en esta aplicación (añadido 'regular')
                                const allowedRoles = [
                                    'admin', 'administrador',
                                    'editor',
                                    'contab', 'contador',
                                    'directivo',
                                    'coord', 'coordinador',
                                    'socio',
                                    'regular'  // Añadido aquí
                                ];

                                if (!allowedRoles.includes(user.role.toLowerCase())) {
                                    Swal.fire({
                                        icon: 'error',
                                        title: 'Acceso denegado',
                                        text: 'No tienes permisos para acceder a esta aplicación.',
                                        willClose: () => {
                                            window.location.href = 'inicio.html';
                                        }
                                    });
                                }

                            } catch (error) {
                                console.error('Error parsing user data:', error);
                                window.location.href = 'index.html';
                            }
                        } else {
                            window.location.href = 'index.html';
                        }
                    }

                    const logoutBtn = document.getElementById('logout-btn');
                    if (logoutBtn) {
                        logoutBtn.addEventListener('click', function () {
                            Swal.fire({
                                title: '¿Cerrar sesión?',
                                text: '¿Estás seguro de que quieres salir del sistema?',
                                icon: 'question',
                                showCancelButton: true,
                                confirmButtonColor: '#3085d6',
                                cancelButtonColor: '#d33',
                                confirmButtonText: 'Sí, cerrar sesión',
                                cancelButtonText: 'Cancelar'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    localStorage.removeItem('user');
                                    window.location.href = 'index.html';
                                }
                            });
                        });
                    }

                    const politicasLink = document.getElementById('ver-politicas-link');
                    if (politicasLink) {
                        politicasLink.addEventListener('click', function (e) {
                            e.preventDefault();
                            const politicasModal = document.getElementById('politicasModal');
                            if (politicasModal && typeof window.initPoliticasModal === 'function') {
                                politicasModal.style.display = 'block';
                            }
                        });
                    }

                    checkSession();

                    // Inicializar menú responsive desde el módulo central (si está cargado)
                    if (typeof initResponsiveMenu === 'function') {
                        initResponsiveMenu();
                    }
                }

        // Cargar el modal de políticas
        document.addEventListener('DOMContentLoaded', function () {
            fetch('politicas-modal.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('politicas-modal-container').innerHTML = data;
                    if (typeof initPoliticasModal === 'function') {
                        setTimeout(initPoliticasModal, 100);
                    }
                })
                .catch(error => {
                    console.error('Error cargando el modal de políticas:', error);
                });
        });
    </script>
</body>

</html>
