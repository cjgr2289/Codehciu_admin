<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="shortcut icon" href="css/favicon.ico" type="image/x-icon">
    <!-- Añadir SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="login-container">
        <img src="css/LOGO.png" alt="LOGO CODEHCIU" class="login-logo">
        <h1>Iniciar Sesión</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="Ingrese su correo">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Ingrese su contraseña">
            </div>
            <button type="submit" class="btn primary-btn">Ingresar</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('api/auth.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const contentType = response.headers.get('content-type');
                let data;

                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    throw new Error(`Respuesta no JSON del servidor: ${text.substring(0, 100)}`);
                }

                if (!response.ok) {
                    // Si el servidor devolviera un código de error HTTP, mostrar mensaje
                    throw new Error(data.message || 'Error en la respuesta del servidor');
                }

                if (data.success) {
                    // Guardar información completa del usuario con nombres consistentes
                    localStorage.setItem('user', JSON.stringify({
                        id: data.user.id,
                        name: data.user.name,
                        email: data.user.email,
                        role: data.user.role,
                        politicas_aceptadas: data.user.politicas_aceptadas,
                        debe_cambiar_password: data.user.debe_cambiar_password
                    }));

                    // Mostrar SweetAlert2 de éxito y redirigir
                    Swal.fire({
                        icon: 'success',
                        title: 'Bienvenido',
                        text: 'Ingresando al panel...',
                        timer: 1200,
                        showConfirmButton: false,
                        willClose: () => {
                            // Redirigir a inicio.html en lugar de admin.html
                            window.location.href = 'inicio.html';
                        }
                    });
                } else {
                    // Mostrar error del servidor con SweetAlert2
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message || 'Credenciales incorrectas'
                    });
                }
            } catch (error) {
                // Mostrar errores de conexión o parsing con SweetAlert2
                Swal.fire({
                    icon: 'error',
                    title: 'Error de conexión',
                    text: error.message
                });
            }
        });
    </script>

    <footer>
        <p>&copy; 2015 CODEHCIU. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
