    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="shortcut icon" href="CSS/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="IMAGES/LOGO.png" alt="CODEHCIU Logo" class="logo">
        </div>
        <div id="verification-result">
            <div class="warning-message">
                <h2>Verificando información</h2>
                <p>Estamos validando los datos, por favor espere...</p>
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const cedula = urlParams.get('cedula');
            
            const resultContainer = document.getElementById('verification-result');
            
            // Validar formato de cédula (puedes ajustar según tus necesidades)
            const cedulaRegex = /^[VEve]\d{5,9}$/;
            
            if (!cedula) {
                resultContainer.innerHTML = `
                    <div class="error-message">
                        <h2>Error: No se proporcionó número de cédula</h2>
                        <p>Redireccionando a la página principal...</p>
                    </div>
                `;
                
                setTimeout(() => {
                    window.location.href = 'https://codehciu.org';
                }, 3000);
                return;
            }
            
            if (!cedulaRegex.test(cedula)) {
                resultContainer.innerHTML = `
                    <div class="error-message">
                        <h2>Error: Formato de cédula inválido</h2>
                        <p>El formato debe ser V o E seguido de números (ej: V12345678)</p>
                        <p><strong>Cédula proporcionada:</strong> ${cedula}</p>
                    </div>
                `;
                return;
            }
            
            // Consultar datos del usuario
            fetch('api/verify_user.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cedula: cedula})
            })
            .then(response => {
                // Verificar si la respuesta es JSON válido
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    return response.text().then(text => {
                        throw new Error(`Respuesta no JSON: ${text.substring(0, 100)}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data.success && data.user) {
                    const user = data.user;
                    
                    if (user.activo == 1) {
                        Swal.fire({
                            title: 'Verificación Exitosa',
                            html: `
                                <div style="text-align: center;">
                                    <img src="IMAGES/LOGO.png" alt="CODEHCIU" style="width: 100px; margin-bottom: 20px;">
                                    <h3>${user.nombre}</h3>
                                    <p>Es un miembro activo de la organización</p>
                                    <p><strong>Cédula:</strong> ${user.cedula}</p>
                                    <p><strong>Cargo:</strong> ${user.cargo}</p>
                                    <p style="margin-top: 20px; font-style: italic;">
                                        Se le acredita como miembro activo de la asociación civil sin fines de lucro "Comisión para los derechos Humanos y la Ciudadanía" CODEHCIU.
                                    </p>
                                    <p>
                                        Como miembro de la misma y como defensor/a de los derechos humanos de acuerdo con los estandares internacionales, se compromete a actuar con integridad, respeto y responsabilidad en todas sus acciones y decisiones.
                                        Se agradece a las autoridades, organismos estadales, funcionarios publicos y otras ONGs prestarles colaboración y apoyo en el ejercicio de sus funciones, reconociendo la importante tarea que desarrollan y su valiosa contribución para la protección de los derechos y libertades fundamentales, de acuerdo con la Resoción AG/RES. 1910 del 10 de junio de 2003 de la ONU.
                                    </p>
                                </div>
                            `,
                            icon: 'success',
                            confirmButtonText: 'Aceptar',
                            confirmButtonColor: '#ec7b3a'
                        });
                        
                        resultContainer.innerHTML = `
                            <div class="success-message">
                                <h2>Verificación Exitosa</h2>
                                <div class="user-info">
                                    <p><strong>Nombre:</strong> ${user.nombre}</p>
                                    <p><strong>Cédula:</strong> ${user.cedula}</p>
                                    <p><strong>Cargo:</strong> ${user.cargo}</p>
                                    <p><strong>Estado:</strong> Activo</p>
                                </div>
                            </div>
                        `;
                    } else {
                        resultContainer.innerHTML = `
                            <div class="error-message">
                                <h2>Usuario No Activo</h2>
                                <p>El usuario no se encuentra activo en el sistema.</p>
                                <div class="user-info">
                                    <p><strong>Nombre:</strong> ${user.nombre}</p>
                                    <p><strong>Cédula:</strong> ${user.cedula}</p>
                                    <p><strong>Estado:</strong> Inactivo</p>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    resultContainer.innerHTML = `
                        <div class="error-message">
                            <h2>Usuario No Encontrado</h2>
                            <p>No se encontró ningún usuario con la cédula proporcionada.</p>
                            <p><strong>Cédula:</strong> ${cedula}</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error en la verificación:', error);
                resultContainer.innerHTML = `
                    <div class="error-message">
                        <h2>Error en la verificación</h2>
                        <p>Ocurrió un error al verificar la cédula. Por favor, intente nuevamente.</p>
                        <p><strong>Detalles:</strong> ${error.message}</p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
